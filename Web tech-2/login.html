<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | GCET Jammu</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-page">
  <div class="login-shell">
    <div class="login-heading">
      <div class="emblem">
    <img src="images/logo.png" alt="GCET Logo">
</div>
      <h1>GOVT. COLLEGE OF ENGINEERING<br>AND TECHNOLOGY, JAMMU</h1>
      <p>(Autonomous College)</p>
    </div>

    <div class="login-card">
      <h2 class="login-title">Student Login</h2>
      <div class="underbar"></div>

      <form action="dashboard.html">
        <div class="input-row">
          <div class="input-icon">♙</div>
          <input type="text" placeholder="Roll Number / Email" required>
        </div>

        <div class="input-row">
          <div class="input-icon">♙</div>
          <input type="password" placeholder="Password" required>
          <div class="eye">◉</div>
        </div>

        <div class="login-options">
          <label class="remember"><input type="checkbox"> <span>Remember Me</span></label>
          <a class="forgot" href="#">Forgot Password?</a>
        </div>

        <button class="btn" type="submit">Login</button>
      </form>

      <div class="or"><span>OR</span></div>
      <button class="email-btn" type="button">✉ &nbsp; Login with College Email</button>
    </div>
  </div>
</div>
</body>
</html>
